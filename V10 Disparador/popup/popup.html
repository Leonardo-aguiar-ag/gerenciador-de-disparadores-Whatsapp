<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disparadores V10</title><style>:root{color-scheme:light dark}body{font:13px system-ui;width:410px;margin:0;padding:14px;background:#f5f7fb;color:#172033}body.dark{background:#111827;color:#e5e7eb}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:10px}.dark .card{background:#1f2937;border-color:#374151}h1{font-size:18px;margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-weight:600;margin:8px 0 4px}input,select,textarea{box-sizing:border-box;width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:7px;background:transparent;color:inherit}textarea{min-height:78px}button{border:0;border-radius:7px;padding:8px 10px;background:#2563eb;color:#fff;cursor:pointer;margin:4px 3px 0 0}.secondary{background:#64748b}.danger{background:#b91c1c}.metric{font-size:20px;font-weight:700}.muted{color:#64748b;font-size:12px}.progress{height:8px;background:#cbd5e1;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#22c55e;width:0}</style></head><body><div id="onboarding" class="card"><b>Primeiros passos V10</b><p class="muted">1. Inicie em simulação · 2. valide uma pequena lista · 3. só então escolha um modo real.</p><button id="finishOnboarding" class="secondary">Entendi</button></div><div class="card"><h1>Gerenciador de Disparadores V10</h1><div class="muted">Onboarding, simulação e dois modos de envio</div><button id="theme" class="secondary">Alternar tema</button><button id="undo" class="secondary">Desfazer</button><span id="status" class="muted"></span></div><div class="card"><label>Backend</label><input id="backendUrl" value="http://localhost:3000"><label>Chave da API (opcional)</label><input id="apiKey" type="password"><label>Modo</label><select id="mode"><option value="simulation">Simulação — não envia</option><option value="cloud_api">WhatsApp Cloud API</option><option value="web">WhatsApp Web</option></select><button id="save">Salvar configurações</button></div><div class="card"><label>Campanha</label><input id="campaign" placeholder="Nome da campanha"><label>Mensagem</label><textarea id="message" placeholder="Olá [NOME], tudo bem?"></textarea><label>Importar CSV/Excel</label><input id="file" type="file" accept=".csv,.txt,.xlsx,.xls"><label>Contatos (telefone;nome;campos...)</label><textarea id="contacts" placeholder="5511999999999;Maria"></textarea><button id="preview" class="secondary">Pré-visualizar e validar</button><button id="queue">Colocar na fila</button><div id="previewBox" class="muted"></div><div class="progress"><i id="bar"></i></div></div><div class="card"><h2 style="font-size:15px">Dashboard</h2><label>Filtro persistente do dashboard</label><input id="filter" placeholder="ex.: campanha, status ou telefone"><div id="metrics" class="grid"></div><button id="refresh" class="secondary">Atualizar</button><button id="update" class="secondary">Verificar atualização</button><div id="updateBox" class="muted"></div></div><div class="card"><button id="backup" class="secondary">Criar backup</button><button id="optout" class="danger">Central de opt-out</button><div id="optoutBox" class="muted"></div></div><script src="../assets/xlsx.full.min.js"></script><script type="module" src="popup.js"></script></body></html>
