<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciador de Disparadores V10</title><style>body{font:15px system-ui;max-width:1100px;margin:2rem auto;padding:0 1rem;background:#f5f7fb;color:#172033}header,.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:1rem 1.2rem;margin-bottom:1rem;box-shadow:0 4px 14px #1720330d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.8rem}.metric{font-size:1.8rem;font-weight:700}.muted{color:#64748b}button{border:0;border-radius:8px;padding:.65rem 1rem;background:#2563eb;color:white;cursor:pointer}pre{white-space:pre-wrap;background:#0f172a;color:#dbeafe;padding:1rem;border-radius:10px}</style></head><body><header><h1>Gerenciador de Disparadores WhatsApp — V10</h1><p class="muted">Dashboard operacional, fila, CRM e atualização assistida pelo GitHub.</p><button id="refresh">Atualizar painel</button> <button id="backup">Criar backup</button></header><section class="grid" id="metrics"></section><section class="card"><h2>Atualizações</h2><div id="updates">Verificando…</div></section><section class="card"><h2>Modo de operação</h2><p id="mode"></p><p class="muted">O modo simulação não envia mensagens reais. Para Cloud API, configure o ambiente do backend.</p></section><section class="card"><h2>Logs recentes</h2><pre id="logs">Carregando…</pre></section><script>const $=id=>document.getElementById(id);async function api(p,o){const r=await fetch(p,o);return r.json()}async function refresh(){const d=await api('/api/dashboard');$('metrics').innerHTML=Object.entries({Contatos:d.contacts,Campanhas:d.campaigns,Mensagens:d.messages,'Fila pendente':(d.byState?.pending||0),'Opt-outs':d.optOuts,'Entrega':d.deliveryRate+'%'}).map(([k,v])=>`<div class="card"><span class="muted">${k}</span><div class="metric">${v}</div></div>`).join('');$('mode').textContent='Modo atual: '+d.mode;const u=await api('/api/updates/check');$('updates').innerHTML=u.available?`Nova versão ${u.latestVersion} disponível. <a href="${u.url}" target="_blank">Ver notas e atualizar</a><pre>${u.notes||''}</pre>`:(u.message||'Você está na versão mais recente.');const l=await api('/api/logs');$('logs').textContent=(l.data||[]).slice(0,20).map(x=>`${x.created_at} [${x.level}] ${x.event} ${JSON.stringify(x.details)}`).join('\n')||'Nenhum log.'}$('refresh').onclick=refresh;$('backup').onclick=async()=>{const r=await api('/api/backups',{method:'POST'});alert(r.file||r.error)};refresh();</script></body></html>
